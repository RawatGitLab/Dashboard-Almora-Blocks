const F=D.features,tot=F.reduce((a,f)=>a+f.properties.Area,0);
const rows=F.map(f=>({Name:f.properties.Name,Distt_Name:f.properties.Distt_Name,Area:f.properties.Area,pct:f.properties.Area/tot*100,g:f.geometry}));
const fm=x=>x.toLocaleString('en-IN',{maximumFractionDigits:1});
const by=[...rows].sort((a,b)=>b.Area-a.Area);
const dists=[...new Set(rows.map(r=>r.Distt_Name))];

document.getElementById('k').innerHTML=[['Blocks',rows.length,dists.join(', ')],['Total area',fm(tot)+' km²','sum of block areas'],['Largest',by[0].Name,fm(by[0].Area)+' km²'],['Smallest',by[by.length-1].Name,fm(by[by.length-1].Area)+' km²'],['Average',fm(tot/rows.length)+' km²','per block']].map(x=>`<div class="c"><div class="l">${x[0]}</div><div class="v">${x[1]}</div><div class="s">${x[2]}</div></div>`).join('');
// map (equirectangular, lat-corrected)
let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;const rings=g=>g.coordinates.flat(1);
rows.forEach(r=>rings(r.g).forEach(p=>p.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)})));
const k=Math.cos((y0+y1)/2*Math.PI/180),W=600,s=W/((x1-x0)*k),H=(y1-y0)*s;
const X=x=>(x-x0)*k*s,Y=y=>H-(y-y0)*s;
let svg=`<svg viewBox="0 0 ${W} ${H}">`;
rows.forEach((r,i)=>{const d=r.g.coordinates.map(pg=>pg.map(rg=>'M'+rg.map(([x,y])=>X(x).toFixed(1)+','+Y(y).toFixed(1)).join('L')+'Z').join('')).join('');svg+=`<path class="p" data-i="${i}" d="${d}"/>`});
rows.forEach(r=>{let b=[1e9,-1e9,1e9,-1e9];rings(r.g).forEach(p=>p.forEach(([x,y])=>{b=[Math.min(b[0],x),Math.max(b[1],x),Math.min(b[2],y),Math.max(b[3],y)]}));r.c=[X((b[0]+b[1])/2),Y((b[2]+b[3])/2)];svg+=`<text class="lb" x="${r.c[0]}" y="${r.c[1]}">${r.Name}</text>`});

let sel=null,sk='Area',asc=false;
function draw(){const q=document.getElementById('q').value.toLowerCase();const a=rows.filter(r=>r.Name.toLowerCase().includes(q)).sort((a,b)=>(a[sk]>b[sk]?1:-1)*(asc?1:-1));
document.getElementById('tb').innerHTML=a.map(r=>`<tr data-n="${r.Name}" class="${r.Name===sel?'on':''}"><td>${r.Name}</td><td>${r.Distt_Name}</td><td class="n">${fm(r.Area)}</td><td class="n">${r.pct.toFixed(1)}%</td></tr>`).join('')}

document.querySelectorAll('th').forEach(h=>h.onclick=()=>{asc=sk===h.dataset.k?!asc:false;sk=h.dataset.k;draw()});
